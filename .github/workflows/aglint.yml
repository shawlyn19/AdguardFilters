name: AGLint

permissions:
  contents: read

env:
  NODE_VERSION: 24

on:
  push:
    branches:
      - master
    paths:
      - "**/*.txt"

      - "**/.aglintignore"

      - "**/.aglintrc"
      - "**/.aglintrc.json"
      - "**/.aglintrc.yaml"
      - "**/.aglintrc.yml"
      - "**/aglint.config.json"
      - "**/aglint.config.yaml"
      - "**/aglint.config.yml"
      - "**/package.json"

      - "package-lock.json"

  pull_request:
    branches:
      - master
    paths:
      - "**/*.txt"

      - "**/.aglintignore"

      - "**/.aglintrc"
      - "**/.aglintrc.json"
      - "**/.aglintrc.yaml"
      - "**/.aglintrc.yml"
      - "**/aglint.config.json"
      - "**/aglint.config.yaml"
      - "**/aglint.config.yml"
      - "**/package.json"

      - "package-lock.json"

jobs:
  lint:
    name: Run AGLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out to repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.2.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4.1.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: AGLint cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4.1.1
        with:
          path: .aglintcache
          key: >
            ${{ runner.os }}-aglint-${{ hashFiles(
              '**/.aglintignore',
              '**/.aglintrc',
              '**/.aglintrc.json',
              '**/.aglintrc.yaml',
              '**/.aglintrc.yml',
              '**/aglint.config.json',
              '**/aglint.config.yaml',
              '**/aglint.config.yml',
              '**/package.json',
              'package-lock.json'
            ) }}
          restore-keys: |
            ${{ runner.os }}-aglint-

      # If the linter found any errors, it will exit with a non-zero code, which will cause the job to fail
      - name: Run AGLint
        run: npm run aglint

  notify:
    name: Send Slack notification on failure
    runs-on: ubuntu-latest
    needs: lint
    # Run this job only if the previous job failed and the event was triggered by the 'AdguardTeam/AdguardFilters' repository
    # Note: 'always()' is needed to run the notify job even if the lint job was failed
    if:
      ${{
        always() &&
        needs.lint.result == 'failure' &&
        github.repository == 'AdguardTeam/AdguardFilters' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    steps:
      - uses: 8398a7/action-slack@3779082e573d93c12a270de1800c40bbd6bbf5d3 # v3.19.0
        with:
          status: failure
          fields: workflow, repo, message, commit, author, eventName, ref, job
          job_name: Run AGLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
